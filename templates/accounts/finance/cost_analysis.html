{% extends "accounts/base.html" %}
{% block dashboard_content %}

<h3>
<i class="bi bi-graph-up text-primary me-2"></i>
Cost Analysis
</h3>

<div class="row g-3 mt-2">

<div class="col-md-3">
<div class="card shadow-sm">
<div class="card-body">

<div class="text-muted">Average Cost</div>
<h3>{{ avg_cost|default:"0.00" }}</h3>

</div>
</div>
</div>

<div class="col-md-3">
<div class="card shadow-sm">
<div class="card-body">

<div class="text-muted">Total Spend</div>
<h3>{{ spend|default:"0.00" }}</h3>

</div>
</div>
</div>

</div>

{% endblock %}
