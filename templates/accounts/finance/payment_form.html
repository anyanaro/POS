{% extends "accounts/base.html" %}

{% block dashboard_content %}

<div class="card shadow-sm">

    <div class="card-header bg-white">

        <h4>

            <i class="bi bi-cash-coin text-success me-2"></i>

            Record Supplier Payment

        </h4>

    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Invoice Number

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ invoice.invoice_no }}"
                        readonly>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Supplier

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ invoice.supplier }}"
                        readonly>

                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">

                    <label class="form-label">

                        Amount

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="amount"
                        value="{{ invoice.total_amount }}"
                        readonly>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">

                        Payment Date

                    </label>

                    <input
                        type="date"
                        name="payment_date"
                        class="form-control"
                        required>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">

                        Payment Method

                    </label>

                    <select
                        name="payment_method"
                        class="form-select"
                        required>

                        {% for value, label in methods %}

                        <option value="{{ value }}">
                            {{ label }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Payment Reference

                </label>

                <input
                    type="text"
                    name="reference"
                    class="form-control"
                    placeholder="Cheque No, Bank Ref, Mpesa Ref..."
                    required>

            </div>

            <hr>

            <button
                type="submit"
                class="btn btn-success">

                <i class="bi bi-check-circle me-1"></i>

                Record Payment

            </button>

            <a href="{% url 'accounts:supplier-invoice-detail' invoice.id %}" class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
