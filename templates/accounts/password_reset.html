{% extends "accounts/base_public.html" %}
{% load crispy_forms_tags %}


{% block dashboard_content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title text-center mb-4">Reset Your Password</h3>
        <p class="text-center">Enter your email address and we'll send you a password reset link.</p>
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary w-100 mt-3">Send Reset Link</button>
        </form>
        <p class="mt-3 text-center">
          <a href="{% url 'accounts:login' %}">Back to login</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
