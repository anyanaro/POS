{% extends "accounts/base.html" %}
{% load branch_tags %}

{% block dashboard_content %}
<div class="container-xxl">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h3>Urgent Requisition</h3>
      <div class="text-muted">Branch: {{ request.session.active_branch_id|branch_name }}</div>
    </div>
    <button form="urgent-form" class="btn btn-danger">
      <i class="bi bi-lightning-charge me-1"></i>Submit Urgent Requisition
    </button>
  </div>

  <form method="post" id="urgent-form">
    {% csrf_token %}
    <div class="card">
      <div class="card-header">Products and quantities</div>
      <div class="card-body">
        <div id="lines">
          <div class="row g-2 mb-2 urgent-line">
            <div class="col-md-8">
              <select name="product_id[]" class="form-select" required>
                <option value="">Select product</option>
                {% for product in products %}
                  <option value="{{ product.id }}">{{ product.sku }} - {{ product.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-3">
              <input type="number" name="qty[]" class="form-control" min="0.0001" step="0.0001" placeholder="Quantity" required>
            </div>
            <div class="col-md-1 d-grid">
              <button type="button" class="btn btn-outline-danger remove-line" title="Remove item">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
        </div>
        <button type="button" id="add-line" class="btn btn-outline-primary">
          <i class="bi bi-plus-circle me-1"></i>Add product
        </button>
      </div>
    </div>
  </form>
</div>

<script>
const lines = document.getElementById('lines');
document.getElementById('add-line').addEventListener('click', () => {
  const first = lines.querySelector('.urgent-line');
  const clone = first.cloneNode(true);
  clone.querySelector('select').value = '';
  clone.querySelector('input').value = '';
  lines.appendChild(clone);
});
lines.addEventListener('click', (event) => {
  const button = event.target.closest('.remove-line');
  if (!button) return;
  const rows = lines.querySelectorAll('.urgent-line');
  if (rows.length > 1) button.closest('.urgent-line').remove();
});
</script>
{% endblock %}
