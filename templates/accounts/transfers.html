{% extends "accounts/base.html" %}

{% block dashboard_content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>
        <i class="bi bi-arrow-left-right me-2 text-primary"></i>
        Stock Transfers
    </h3>

    <div class="btn-group">
        <a href="{% url 'accounts:transfer-approvals' %}" class="btn btn-outline-warning">

            <i class="bi bi-check2-square me-1"></i>
            Pending Approvals

        </a>

        <a href="{% url 'accounts:transfer-history' %}" class="btn btn-outline-primary">

            <i class="bi bi-clock-history me-1"></i>
            History

        </a>
    </div>
</div>

<div class="row g-3 mb-4">

    <div class="col-md-4">
        <div class="card shadow-sm border-0">

            <div class="card-body text-center">

                <h6 class="text-muted">
                    Pending
                </h6>

                <h2 class="text-warning">
                    {{ pending }}
                </h2>

            </div>

        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm border-0">

            <div class="card-body text-center">

                <h6 class="text-muted">
                    Approved
                </h6>

                <h2 class="text-info">
                    {{ approved }}
                </h2>

            </div>

        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm border-0">

            <div class="card-body text-center">

                <h6 class="text-muted">
                    Executed
                </h6>

                <h2 class="text-success">
                    {{ executed }}
                </h2>

            </div>

        </div>
    </div>

</div>

<div class="card shadow-sm">

    <div class="card-header">
        <h5 class="mb-0">
            Transfer Actions
        </h5>
    </div>

    <div class="card-body">

        <div class="row g-3">

            <div class="col-md-4">

                <a href="{% url 'accounts:transfer-approvals' %}">

                    <i class="bi bi-check-circle me-2"></i>
                    Approve Transfers

                </a>

            </div>

            <div class="col-md-4">

                <a href="{% url 'accounts:transfer-history' %}">

                    <i class="bi bi-clock-history me-2"></i>
                    View History & Post Transfers

                </a>

            </div>

            <div class="col-md-4">

                <a href="{% url 'accounts:transfer-stats' %}">

                    <i class="bi bi-graph-up-arrow me-2"></i>
                    Transfer Analytics

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
