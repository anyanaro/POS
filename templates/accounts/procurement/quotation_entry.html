{% extends "accounts/base.html" %}

{% block dashboard_content %}

<div class="card shadow-sm">

    <div class="card-header bg-white">

        <h4>

            RFQ

            {{ quotation.rfq_no }}

        </h4>

        <div class="text-muted">

            Supplier:
            {{ quotation.supplier }}

        </div>

    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            <table class="table table-bordered">

                <thead>

                    <tr>

                        <th>Product</th>
                        <th>Qty</th>
                        <th>Unit Price</th>

                    </tr>

                </thead>

                <tbody>

                    {% for line in quotation.lines.all %}

                    <tr>

                        <td>
                            {{ line.product }}
                        </td>

                        <td>
                            {{ line.qty|floatformat:0 }}
                        </td>

                        <td>

                            <input
                                type="number"
                                step="0.0001"
                                name="price_{{ line.id }}"
                                value="{{ line.unit_price|floatformat:0 }}"
                                class="form-control">

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

            <button
                type="submit"
                class="btn btn-success">

                Save Quotation

            </button>

        </form>

    </div>

</div>

{% endblock %}
