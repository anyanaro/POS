{% extends "accounts/base_public.html" %}
{% load crispy_forms_tags %}

{% block dashboard_content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title text-center mb-4">Create an Account</h3>
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-success w-100 mt-3">Register</button>
        </form>
        <p class="mt-3 text-center">
          Already have an account? <a href="{% url 'accounts:login' %}">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
