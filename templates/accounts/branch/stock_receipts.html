{% extends "accounts/base.html" %}
{% block dashboard_content %}

<h3>
<i class="bi bi-box-arrow-in-down text-success me-2"></i>
Stock Receipts
</h3>

<div class="card shadow-sm mt-3">

<div class="card-body table-responsive">

<table class="table table-hover erp-table">

<thead>

<tr>
<th>GRN</th>
<th>Branch</th>
<th>Date</th>
<th>Status</th>
</tr>

</thead>

<tbody>

{% for receipt in receipts %}

<tr>

<td>{{ receipt.grn_no }}</td>
<td>{{ receipt.branch }}</td>
<td>{{ receipt.received_at }}</td>

<td>

<span class="badge bg-success">

{{ receipt.status }}

</span>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

{% endblock %}
